pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,vue}"
      run: npx oxfmt {staged_files}
      stage_fixed: true
    type-check:
      run: npm run type-check

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
