pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,vue}"
      run: npx eslint {staged} --fix && npx oxfmt {staged}
      stage_fixed: true
  jobs:
    - name: type-check
      run: npm run type-check

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
